apiVersion: v1
kind: Service
metadata:
  name: client-node-port
spec:
  type: NodePort
  ports:
    - port: 3050 # interpod access port (eg. another container needs to access this pod)
      targetPort: 3000
      nodePort: 31515 # (30k to 32767 - can be left blank for random)
  selector:
    component: web